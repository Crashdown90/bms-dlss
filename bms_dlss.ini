; bms-dlss settings
; Use the in-game menu (Alt+N) for most options - it saves its changes to this file (comments stay).
; Missing keys use their default values. Changes made by hand here apply after a game restart.
; Sections marked ADVANCED / DEBUG are for testing and troubleshooting - do not change them unless asked
; when reporting a bug.
;
; Power saving mode (F4, experimental): the installer binds F4 to a lower render resolution
; (mat_viewportscale) and DLSS reconstructs the full image from it. Output stays at native resolution.
; If the image stays blurry after uninstalling the mod, type mat_viewportscale 1 in the game console.

[keys]
; Mod hotkeys: Alt+N = settings menu, Alt+F8 = mod on / off (compare with the original image).
; Everything else is set in the menu. F4 (power saving mode) is a game key bound in autoexec.cfg.
; DebugKeys: 0 = off (default). 1 = developer hotkeys (codes below) and the Debug section in the menu
; (Advanced page). With 0 the game receives those keys normally.
DebugKeys=0
; Test shortcuts (menu Advanced -> Keys): 1 = Alt+F9 cycles Frame Generation off -> DLSS-G -> FSR -> off,
; Alt+F10 switches the upscaler DLSS <-> FSR. Changes made with these keys are not saved. Default 0.
TestKeys=0
; Virtual-key codes (https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes).
; All keys below except BridgeKey and MenuKey work only with DebugKeys=1.
; Alt+F10: frame capture (debug)
CaptureKey=0x79
; Alt+F11: jitter on / off; with DLAA running it cycles the jitter sign instead
JitterKey=0x7A
; Alt+F8: mod on / off (always active)
BridgeKey=0x77
; Alt+F9: DLSS preset default -> K -> L -> M
PresetKey=0x78
; Alt+Home: sharpening 0 -> 0.2 -> ... -> 1.0 -> 0
SharpenKey=0x24
; Alt+Del: mip bias on / off
MipBiasKey=0x2E
; Alt+Ins: DLSS input mode ([dlaa] InputMode)
InputModeKey=0x2D
; Alt+F5: depth mode ([dlaa] DepthMode)
DepthModeKey=0x74
; Alt+F3: output scale ([upscale] OutputScale) 1.0 -> 4/3 -> 1.5 -> 1.724 -> 2.0
OutputScaleKey=0x72
; Alt+F2: jitter phases ([jitter] Phases)
PhasesKey=0x71
; Alt+F1: downscale filter ([upscale] DownsampleFilter)
DownsampleKey=0x70
; Alt+ScrollLock: helper synchronization ([bridge] Pipeline)
PipelineKey=0x91
; Alt+Backspace: motion vectors of moving objects ([mv] ObjectMV)
ObjectMVKey=0x08
; Alt+F12: latency reduction mode ([latency] Mode)
LatencyKey=0x7B
; Modifier for the mod hotkeys: alt (default), ctrl, rctrl (right Ctrl), shift, none.
; Only this modifier may be held (Ctrl+Alt+F9 does not act as Alt+F9).
Modifier=alt
; 1 = hotkeys need the modifier above (default), 0 = hotkeys without a modifier
RequireCtrl=1
; Alt+N: settings menu (always active). Arrows up / down = select, left / right = change, Enter = apply now,
; Del = default value, Tab = Basic / Advanced page, Esc = close. While the menu is open the game gets no keys.
MenuKey=0x4E

[jitter]
; ADVANCED. Length of the sub-pixel jitter sequence (Halton 2,3). 8 (default) = fixed 8 phases, most stable on
; fences in Black Mesa. 0 = automatic by output scale: 8 * S^2 (NVIDIA recommendation).
Phases=8
; DEBUG. 1.0 = real sub-pixel jitter. Larger values make the whole 3D world visibly shake (visual check only).
Scale=1.0
; DEBUG. 1 = jitter on right after start (DLAA turns it on by itself)
StartEnabled=0

[bridge]
; ADVANCED. Mode after start: 0 = off, 3 = DLAA / upscaler on (default). 1, 2 and 4 are debug modes
; (copy, mirror, motion vector view).
StartMode=3
; DEBUG. 0 = Alt+F8 toggles off <-> on only. 1 = Alt+F8 also cycles through the debug modes.
DebugCycle=0
; ADVANCED. Synchronization with bms_dlss_helper.exe:
; 1 = pipelined (default): the game does not wait for the helper on the CPU. If the helper stops or does not
;     respond for 5 s, the mod turns itself off and the game keeps running.
; 0 = synchronous: the game waits on the CPU until the helper has submitted the frame (max 100 ms).
Pipeline=1

[dlaa]
; DLSS preset: 0 = default (K), otherwise K, L or M. Also in the menu.
; K is the calmest on fences and the best choice with Frame Generation; L keeps animated water sharper.
Preset=0
; ADVANCED. DLSS input: 0 = LDR (sRGB), 1 = linear HDR (default), 2 = linear HDR with auto exposure,
; 3 = linear HDR with inverse tone mapping (experimental). Applies to DLSS only.
InputMode=1
; ADVANCED. Input mode used with preset L (same values). Default 0 = LDR, fences are calmest with L in LDR.
InputModeL=0
; ADVANCED. 1 = on a camera jump prefer the candidate that continues the previous frame (avoids false cuts when
; the game renders a security camera / monitor). 0 = off.
CamHold=1
; ADVANCED. Inverse tone mapping strength for InputMode 3 (0 .. 0.99).
ITMStrength=0.95
; DEBUG. Depth for DLSS: 0 = original (default), 1 = nearest depth in 3x3, 2 = constant depth (diagnostics).
DepthMode=0
; Sharpening after DLSS / FSR (AMD FidelityFX RCAS): 0 = off, 0.1 .. 1.0 = strength. Also in the menu.
Sharpness=0.0
; Mip LOD bias for scene textures (sharper textures; HUD and menus are not affected). 0 = off. Default -0.5.
; With a lower render resolution (F4) the matching offset is added automatically. Also in the menu.
MipBias=-0.5
; ADVANCED. Extra mip bias for normal maps / alpha-tested surfaces (fences, foliage), -2 .. 2. Default 0 = off.
MipBiasNormal=0
MipBiasAlphaTest=0
; DEBUG. Sign of the jitter passed to DLSS (1 or -1). Try flipping only if a static image is blurry or wobbles.
JitterSignX=1
JitterSignY=1
; DEBUG. Motion vector multiplier (1 = unchanged, -1 = reversed).
MVScaleX=1
MVScaleY=1
; ADVANCED. Depth threshold of the weapon in hand (viewmodel). 0 = do not separate it.
ViewmodelDepth=0.1
; DEBUG. 1 = weapon motion vector check in bms_dlss_helper.log every 5 s (costs VRAM).
ViewmodelCheck=0
; ADVANCED. Camera cut detection: reset the DLSS history when the camera moves more than CutDistance units or
; turns more than CutAngle degrees between two frames (teleport, cutscene). 0 = criterion off.
CutDistance=128
CutAngle=45
; DEBUG. Motion vector view: pixels of motion per frame that give full color.
MVDebugRange=16
; DEBUG. NVIDIA NGX log in bms_dlss_helper.log: 0 = off, 1 = on, 2 = verbose.
NgxLog=0

[mv]
; Motion vectors of moving objects (NPCs, doors, lifts, physics props). Without them moving objects leave a trail
; (ghosting). 1 = on (default), 0 = off. Also in the menu.
ObjectMV=1
; ADVANCED. Depth tolerance for object motion vectors (0.02 = 2 % of the distance from the camera, 0 .. 1).
DepthTol=0.02
; ADVANCED. Largest object movement per frame in game units; a bigger jump counts as a teleport.
TeleportDist=64
; DEBUG. 1 = also replay static objects and log the motion vector error (costs performance).
Validate=0
; ADVANCED. 1 = the weapon in hand gets its own motion vectors (default), 0 = no motion.
Viewmodel=1

[upscale]
; Output scale (supersampling inside the mod, a replacement for DLDSR): the game runs at native resolution,
; DLSS produces a W*S x H*S image and the helper scales it back down. Sharper, but costs more GPU time.
; 1.0 = DLAA (default), 4/3, 1.5, 1.724, 2.0 (3.0 = only here, very expensive). Also in the menu. FSR: 1.0 only.
OutputScale=1.0
; Upscaler:
;   auto = default: NVIDIA DLSS where available (NVIDIA RTX cards), otherwise AMD FSR
;   dlss = DLSS only (if this card cannot run it, FSR runs and the log shows a warning)
;   fsr  = AMD FSR (all cards with Vulkan)
;   off  = mod off after start
; The menu shows what actually runs, including the library version.
Upscaler=auto
; ADVANCED. FsrVersion: part of a version name offered by the AMD library (e.g. 3.1); empty = newest available.
; FsrSignatureCheck: 1 = the AMD DLLs next to the helper are loaded only with a valid AMD signature (default).
;FsrVersion=
;FsrSignatureCheck=1
; ADVANCED. Mip bias with output scale > 1: 0 = relative to the final image (default), 1 = NVIDIA formula.
MipBiasMode=0
; ADVANCED. Downscale filter with output scale > 1: 0 = Lanczos-2, 1 = Catmull-Rom (default), 2 = Mitchell, 3 = box.
DownsampleFilter=1
; ADVANCED. Downscale in 0 = sRGB (default), 1 = linear light.
DownsampleLinear=0
; Effect fixes for a lower render resolution (F4 power saving mode): dynamic lights, sun shadow and glow, soft
; particles, refraction. 1 = on (default), 0 = off. No effect at native resolution.
LightsB=1
; DEBUG. Search for further affected shaders (log lines "detektor B:"). 0 = off.
LightsBDetect=0
; 1 (default) = skip the game's FXAA on frames processed by DLSS / FSR (it would only blur them).
; 0 = FXAA follows the game setting.
SkipGameFxaa=1
; 1 (default) = turn off the game's MSAA while the mod is active (DLSS / FSR does the anti-aliasing; the mod cannot
; work with MSAA). 0 = keep MSAA (the mod then stays inactive and the menu shows a warning).
StripMsaa=1
; ADVANCED. Reactive mask for particles and transparent effects (FSR only). 0 = off (default, no measurable gain).
ReactiveMask=0
ReactiveScale=1.0
ReactiveMax=0.9
ReactiveFsr=1
ReactiveDlss=0
ReactiveTC=0
ReactiveGlass=0

[capture]
; DEBUG. Frame capture (debug key / menu Debug section): D3D9 call list in bms_dlss_capture_NNN.txt.
; Frames per capture (1 .. 10).
Frames=3
; DEBUG. Automatic capture N seconds after start (0 = off).
AutoAfterSec=0

[latency]
; Latency reduction (similar to NVIDIA Reflex, not Reflex itself): when the game is GPU bound, the mod paces the
; game so the GPU queue holds at most about one frame - lower input latency, same FPS. It does nothing below an
; FPS cap or when CPU bound, and turns itself off when unsure (window not in the foreground, reset, errors).
; 0 = off, 1 = adaptive (default), 2 = measure only. Also in the menu.
Mode=1
; ADVANCED. Minimum safety margin in ms (0.1 .. 5). Larger = less risk of GPU starvation, smaller = lower latency.
MarginMs=0.5
; DEBUG. 1 = only while the game window is in the foreground (default).
ForegroundOnly=1

[fg]
; Frame Generation: generated frames are inserted between real game frames. Set it in the menu
; (Alt+N, Frame Generation); turning it on and off applies immediately.
;   0           = off (default)
;   dlssg       = NVIDIA DLSS Frame Generation (RTX 40 and newer; 3x - 6x RTX 50 only)
;   fsr2x       = AMD FSR Frame Generation (any GPU with Vulkan; 2x - 5x). Not yet tested on AMD / Intel GPUs.
;   fsradaptive = FSR adaptive: generates only as many frames as needed to reach TargetFps
; With Frame Generation on, frames are shown by the mod instead of the game, so the DXVK HUD, Steam overlay and
; OBS "game capture" do not see them (use window / display capture in OBS). If Frame Generation fails, the game
; falls back to its normal image (never a black screen) and the menu explains why.
; In-game V-Sync: keep it off and use the mod's FPS cap (TargetFps) with G-SYNC / FreeSync. With V-Sync on, or in
; exclusive fullscreen at a resolution other than the desktop, Frame Generation can only start with a game restart.
; Input latency with Frame Generation is roughly twice that of the same FPS cap without it.
Mode=0
; ADVANCED. 1 (default) = Frame Generation can be turned on and off while playing. 0 = only at game start.
LiveSwitch=1
; ADVANCED. Who shows the frames: 1 (default) = the game process (G-SYNC / FreeSync works with Frame Generation),
; 0 = the helper (fixed refresh rate, slight stutter).
GamePresent=1
; ADVANCED. 1 (default) = frames are handed over early with their display time (more even pacing).
GamePresentEarly=1
; Multiplier: displayed frames per real frame. 2 (default); DLSS-G 3x - 6x only on RTX 50; FSR 3x - 5x on all cards.
; A higher multiplier means fewer real frames at the same cap (more latency, more generated artifacts).
; auto = chosen by GPU headroom (needs LimiterAdapt=3); changes while playing. Also in the menu.
Multiplier=2
; Limits for Multiplier=auto (2 .. 6; never above what the GPU supports).
AutoMinMultiplier=2
AutoMaxMultiplier=6
; Multiplier at start with auto (default = AutoMinMultiplier).
AutoStartMultiplier=2
; ADVANCED. Auto raises the multiplier only when the real-frame cap would have to drop below this percentage
; (50 .. 99, default 75).
AutoUpBelow=75
; ADVANCED. Seconds to hold before raising / lowering the multiplier.
AutoUpHold=3.0
AutoDownHold=1.0
; DEBUG. Experimental UI mask for DLSS-G. 0 = off (default).
DlssgUiAlpha=0
; ADVANCED. Sharpening of generated frames (0 .. 1; 0 = off, not recommended).
SharpenGen=0
; FPS cap of DISPLAYED frames (target for FSR adaptive). The game renders cap / multiplier real frames.
; 0 = automatic from the monitor refresh rate like NVIDIA Reflex: Hz - Hz*Hz/3600 (165 Hz -> 157, 144 -> 138,
; 240 -> 224), below the G-SYNC / FreeSync limit. Keep a driver / RTSS FPS limit at the same or a higher value.
TargetFps=0
; FSR adaptive: cap of REAL game frames (0 = off; e.g. 60 / 80 / 100 / 120 - the rest up to the target is generated).
RealCap=0
; FSR adaptive: generate only below this real FPS (0 = auto, 90 % of the target).
FillBelow=0
; 0 (default) = keep generating while the mod menu (Alt+N) is open. 1 = pause Frame Generation while the menu is open.
PauseInMenu=0
; ADVANCED. GPU headroom regulator for the real-frame cap: 3 (default) = by GPU time (fast, like Reflex),
; 2 = by missed slots, 1 = old experiment, 0 = off.
LimiterAdapt=3
; ADVANCED. Regulator 3 also for FSR adaptive (1 = on, default 0).
LimiterAdaptFsr=0
; ADVANCED. Catch-up of generated frames: 2 (default) = only for frames finished on the GPU, 1 = by queue length,
; 0 = drop late frames.
Catchup=2
; ADVANCED. After turning Frame Generation on while playing, refresh the presentation window once after this many
; ms (against a frozen image). 0 = off.
LiveRefreshMs=800
; ADVANCED. Refresh method: 4 = brief layered window at switch-on (one flicker, default), 3 = layered + new swapchain
; after LiveRefreshMs, 0 = none.
LiveRefreshMode=4
; ADVANCED. 1 (default) = also pass the image without HUD to the generator, so the HUD does not move with the scene
; in generated frames. 0 = off.
HudLess=1
; ADVANCED. Limiter margin in percent below TargetFps / multiplier (default 1.0).
LimiterMargin=1.0
; DEBUG. MatrixTranspose: camera matrix convention for DLSS-G. DumpFrames=N: save N sets of frames as BMP next to the
; helper log after DumpAfter generated frames (large files).
MatrixTranspose=1
DumpFrames=0
DumpAfter=300
; Other debug keys are not listed here.

[present]
; DEBUG. Experimental presentation path for tests only. 0 = off (default).
HelperPresent=0
; DEBUG. Presentation target: 0 = child window (default), 1 = game window directly.
; Target=0
; DEBUG. Start time limit of Frame Generation in ms (default 30000). If Frame Generation does not start in time,
; it can be retried by turning it off and on in the menu.
; StartTimeoutMs=30000

[menu]
; In-game settings menu (Alt+N). Drawn on top of the finished image (DLSS / FSR do not see it). The keyboard hook
; is limited to the game window while the game runs; while the menu is open the game receives no keys
; (except F4, Alt+F4, PrintScreen, Windows and media keys).
; After closing, the menu writes only the keys it changed to this file.
; 0 = no menu, no keyboard hook and no on-screen messages
Enable=1
; 1 = the hook also keeps the mod hotkeys (Alt+F8 ...) from the game; other Alt keys always reach the game.
; 0 = only the menu key and keys while the menu is open
SwallowKeys=1
; Text size: 0.5 .. 1.5
Scale=1.0
; Menu position: center, left, right, topleft, topright
Position=center
; Language: auto (by the game language: Czech -> Czech, otherwise English), cs, en
Language=auto
; On-screen messages: 1 = a short "item: value" line top left after a hotkey change (2 s), 0 = beep and log only
Osd=1
; 1 = show "bms-dlss settings: Alt+N" once for 6 s after start, 0 = off
StartHint=1
; FPS counter: 1 = small line top right "FPS 78 / 156" (real / displayed frames). Default 0. Also in the menu.
FpsCounter=0
; 1 = show the running upscaler and Frame Generation with version and multiplier in the corner. Default 0.
OverlayVersions=0
; 1 = hotkeys beep, 0 = silent
Beep=1
; DEBUG. 1 = no keyboard hook (keys are polled; the game receives them too)
NoHook=0
; DEBUG. Automated menu test: TestOpenSec=N opens the menu N seconds after start (0 = off).
TestOpenSec=0
