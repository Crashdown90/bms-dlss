; bms-dlss settings
; Use the in-game menu (Alt+N) for most options - it saves its changes to this file (comments stay).
; Missing keys use their default values. Changes made by hand here apply after a game restart.
; Sections marked ADVANCED / DEBUG are for testing and troubleshooting - do not change them unless asked
; when reporting a bug.
;
; Power saving mode (F4, experimental): the installer binds F4 to a lower render resolution
; (mat_viewportscale) and DLSS reconstructs the full image from it. Output stays at native resolution.
; If the image stays blurry after uninstalling the mod, type mat_viewportscale 1 in the game console.

[keys]
; Mod hotkeys: Alt+N = settings menu, Alt+F8 = mod on / off (compare with the original image).
; Everything else is set in the menu. F4 (power saving mode) is a game key bound in autoexec.cfg.
; DebugKeys: 0 = off (default). 1 = developer hotkeys (codes below) and the Debug section in the menu
; (Advanced page). With 0 the game receives those keys normally.
DebugKeys=0
; Test shortcuts (menu Advanced -> Keys): 1 = Alt+F9 cycles Frame Generation off -> DLSS-G -> DLSS-G adaptive ->
; FSR -> FSR adaptive -> off (modes the GPU does not support are skipped), Alt+F10 switches the upscaler
; DLSS <-> FSR. Changes made with these keys are not saved. Default 0.
TestKeys=0
; Virtual-key codes (https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes).
; All keys below except BridgeKey and MenuKey work only with DebugKeys=1.
; Alt+F10: frame capture (debug)
CaptureKey=0x79
; Alt+F11: jitter on / off; with DLAA running it cycles the jitter sign instead
JitterKey=0x7A
; Alt+F8: mod on / off (always active)
BridgeKey=0x77
; Alt+F9: DLSS preset default -> K -> L -> M
PresetKey=0x78
; Alt+Home: sharpening 0 -> 0.2 -> ... -> 1.0 -> 0
SharpenKey=0x24
; Alt+Del: mip bias on / off
MipBiasKey=0x2E
; Alt+Ins: DLSS input mode ([dlaa] InputMode)
InputModeKey=0x2D
; Alt+F5: depth mode ([dlaa] DepthMode)
DepthModeKey=0x74
; Alt+F3: output scale ([upscale] OutputScale) 1.0 -> 4/3 -> 1.5 -> 1.724 -> 2.0
OutputScaleKey=0x72
; Alt+F2: jitter phases ([jitter] Phases)
PhasesKey=0x71
; Alt+F1: downscale filter ([upscale] DownsampleFilter)
DownsampleKey=0x70
; Alt+ScrollLock: helper synchronization ([bridge] Pipeline)
PipelineKey=0x91
; Alt+Backspace: motion vectors of moving objects ([mv] ObjectMV)
ObjectMVKey=0x08
; Alt+F12: latency reduction mode ([latency] Mode)
LatencyKey=0x7B
; Modifier for the mod hotkeys: alt (default), ctrl, rctrl (right Ctrl), shift, none.
; Only this modifier may be held (Ctrl+Alt+F9 does not act as Alt+F9).
Modifier=alt
; 1 = hotkeys need the modifier above (default), 0 = hotkeys without a modifier
RequireCtrl=1
; Alt+N: settings menu (always active). Arrows up / down = select, left / right = change, Enter = apply now,
; Del = default value, Tab = Basic / Advanced page, Esc = close. While the menu is open the game gets no keys.
MenuKey=0x4E

[jitter]
; ADVANCED. Length of the sub-pixel jitter sequence (Halton 2,3). 8 (default) = fixed 8 phases, most stable on
; fences in Black Mesa. 0 = automatic by output scale: 8 * S^2 (NVIDIA recommendation).
Phases=8
; DEBUG. 1.0 = real sub-pixel jitter. Larger values make the whole 3D world visibly shake (visual check only).
Scale=1.0
; DEBUG. 1 = jitter on right after start (DLAA turns it on by itself)
StartEnabled=0

[bridge]
; ADVANCED. Mode after start: 0 = off, 3 = DLAA / upscaler on (default). 1, 2 and 4 are debug modes
; (copy, mirror, motion vector view).
StartMode=3
; DEBUG. 0 = Alt+F8 toggles off <-> on only. 1 = Alt+F8 also cycles through the debug modes.
DebugCycle=0
; ADVANCED. Synchronization with bms_dlss_helper.exe:
; 1 = pipelined (default): the game does not wait for the helper on the CPU. If the helper stops or does not
;     respond for 5 s, the mod turns itself off and the game keeps running.
; 0 = synchronous: the game waits on the CPU until the helper has submitted the frame (max 100 ms).
Pipeline=1

[dlaa]
; DLSS preset: 0 = default (K), otherwise K, L or M. Also in the menu.
; K is the calmest on fences and the best choice with Frame Generation; L keeps animated water sharper.
Preset=0
; ADVANCED. DLSS input: 0 = LDR (sRGB), 1 = linear HDR (default), 2 = linear HDR with auto exposure,
; 3 = linear HDR with inverse tone mapping (experimental). Applies to DLSS only.
InputMode=1
; ADVANCED. Input mode used with preset L (same values). Default 0 = LDR, fences are calmest with L in LDR.
InputModeL=0
; ADVANCED. 1 = on a camera jump prefer the candidate that continues the previous frame (avoids false cuts when
; the game renders a security camera / monitor). 0 = off.
CamHold=1
; ADVANCED. Inverse tone mapping strength for InputMode 3 (0 .. 0.99).
ITMStrength=0.95
; DEBUG. Depth for DLSS: 0 = original (default), 1 = nearest depth in 3x3, 2 = constant depth (diagnostics).
DepthMode=0
; Sharpening after DLSS / FSR (AMD FidelityFX RCAS): 0 = off, 0.1 .. 1.0 = strength. Also in the menu.
Sharpness=0.0
; Mip LOD bias for scene textures (sharper textures; HUD and menus are not affected). 0 = off. Default -0.5.
; With a lower render resolution (F4) the matching offset is added automatically. Also in the menu.
MipBias=-0.5
; ADVANCED. Extra mip bias for normal maps / alpha-tested surfaces (fences, foliage), -2 .. 2. Default 0 = off.
MipBiasNormal=0
MipBiasAlphaTest=0
; DEBUG. Sign of the jitter passed to DLSS (1 or -1). Try flipping only if a static image is blurry or wobbles.
JitterSignX=1
JitterSignY=1
; DEBUG. Motion vector multiplier (1 = unchanged, -1 = reversed).
MVScaleX=1
MVScaleY=1
; ADVANCED. Depth threshold of the weapon in hand (viewmodel). 0 = do not separate it.
ViewmodelDepth=0.1
; DEBUG. 1 = weapon motion vector check in bms_dlss_helper.log every 5 s (costs VRAM).
ViewmodelCheck=0
; ADVANCED. Camera cut detection: reset the DLSS history when the camera moves more than CutDistance units or
; turns more than CutAngle degrees between two frames (teleport, cutscene). 0 = criterion off.
CutDistance=128
CutAngle=45
; DEBUG. Motion vector view: pixels of motion per frame that give full color.
MVDebugRange=16
; DEBUG. NVIDIA NGX log in bms_dlss_helper.log: 0 = off, 1 = on, 2 = verbose.
NgxLog=0

[mv]
; Motion vectors of moving objects (NPCs, doors, lifts, physics props). Without them moving objects leave a trail
; (ghosting). 1 = on (default), 0 = off. Also in the menu.
ObjectMV=1
; ADVANCED. Depth tolerance for object motion vectors (0.02 = 2 % of the distance from the camera, 0 .. 1).
DepthTol=0.02
; ADVANCED. Largest object movement per frame in game units; a bigger jump counts as a teleport.
TeleportDist=64
; DEBUG. 1 = also replay static objects and log the motion vector error (costs performance).
Validate=0
; ADVANCED. 1 = the weapon in hand gets its own motion vectors (default), 0 = no motion.
Viewmodel=1

[upscale]
; Output scale (supersampling inside the mod, a replacement for DLDSR): the game runs at native resolution,
; DLSS produces a W*S x H*S image and the helper scales it back down. Sharper, but costs more GPU time.
; 1.0 = DLAA (default), 4/3, 1.5, 1.724, 2.0 (3.0 = only here, very expensive). Also in the menu. FSR: 1.0 only.
OutputScale=1.0
; Upscaler:
;   auto = default: NVIDIA DLSS where available (NVIDIA RTX cards), otherwise AMD FSR
;   dlss = DLSS only (if this card cannot run it, FSR runs and the log shows a warning)
;   fsr  = AMD FSR (all cards with Vulkan)
;   off  = mod off after start
; The menu shows what actually runs, including the library version.
Upscaler=auto
; ADVANCED. FsrVersion: part of a version name offered by the AMD library (e.g. 3.1); empty = newest available.
; FsrSignatureCheck: 1 = the AMD DLLs next to the helper are loaded only with a valid AMD signature (default).
;FsrVersion=
;FsrSignatureCheck=1
; ADVANCED. Mip bias with output scale > 1: 0 = relative to the final image (default), 1 = NVIDIA formula.
MipBiasMode=0
; ADVANCED. Downscale filter with output scale > 1: 0 = Lanczos-2, 1 = Catmull-Rom (default), 2 = Mitchell, 3 = box.
DownsampleFilter=1
; ADVANCED. Downscale in 0 = sRGB (default), 1 = linear light.
DownsampleLinear=0
; Effect fixes for a lower render resolution (F4 power saving mode): dynamic lights, sun shadow and glow, soft
; particles, refraction. 1 = on (default), 0 = off. No effect at native resolution.
LightsB=1
; DEBUG. Search for further affected shaders (log lines "detektor B:"). 0 = off.
LightsBDetect=0
; 1 (default) = skip the game's FXAA on frames processed by DLSS / FSR (it would only blur them).
; 0 = FXAA follows the game setting.
SkipGameFxaa=1
; 1 (default) = turn off the game's MSAA while the mod is active (DLSS / FSR does the anti-aliasing; the mod cannot
; work with MSAA). 0 = keep MSAA (the mod then stays inactive and the menu shows a warning).
StripMsaa=1
; ADVANCED. Reactive mask for particles and transparent effects (FSR only). 0 = off (default, no measurable gain).
ReactiveMask=0
ReactiveScale=1.0
ReactiveMax=0.9
ReactiveFsr=1
ReactiveDlss=0
ReactiveTC=0
ReactiveGlass=0

[capture]
; DEBUG. Frame capture (debug key / menu Debug section): D3D9 call list in bms_dlss_capture_NNN.txt.
; Frames per capture (1 .. 10).
Frames=3
; DEBUG. Automatic capture N seconds after start (0 = off).
AutoAfterSec=0

[latency]
; Latency reduction (similar to NVIDIA Reflex, not Reflex itself): when the game is GPU bound, the mod paces the
; game so the GPU queue holds at most about one frame - lower input latency, same FPS. It does nothing below an
; FPS cap or when CPU bound, and turns itself off when unsure (window not in the foreground, reset, errors).
; 0 = off, 1 = adaptive (default), 2 = measure only. Also in the menu.
Mode=1
; ADVANCED. Minimum safety margin in ms (0.1 .. 5). Larger = less risk of GPU starvation, smaller = lower latency.
MarginMs=0.5
; DEBUG. 1 = only while the game window is in the foreground (default).
ForegroundOnly=1
; ADVANCED. 1 = with Frame Generation, the FPS cap waits just before the game reads mouse and keyboard input,
; instead of after the frame is sent to the GPU (Black Mesa draws on a second thread, so the old wait made every
; input sit one more frame in the game's queue). Lower input latency at the same FPS. Falls back to the old wait
; by itself when unsure. 0 = off (default). 2 = also the latency reduction without Frame Generation (experimental).
SampleSync=0

[fg]
; Frame Generation: generated frames are inserted between real game frames. Set it in the menu
; (Alt+N, Frame Generation); turning it on and off applies immediately.
;   0           = off (default)
;   dlssg       = NVIDIA DLSS Frame Generation (RTX 40 and newer; 3x - 6x RTX 50 only)
;   fsr2x       = AMD FSR Frame Generation (any GPU with Vulkan; 2x - 6x). Not yet tested on AMD / Intel GPUs.
;   fsradaptive = FSR adaptive: generates only as many frames as needed to reach TargetFps
;   dlssgadaptive = DLSS-G adaptive: the same as FSR adaptive, but the frames come from DLSS Frame Generation.
;                 Needs a GPU with DLSS-G multi frame generation (RTX 50); on other cards the mod switches to
;                 FSR adaptive (or DLSS-G) and says so in the log and on screen. Generated frames sit at k/n of
;                 the way between two real frames (n up to 6), so their timing is up to 1/12 of a real frame
;                 interval off the ideal (about 0.2 - 0.5 ms). Costs more GPU time than FSR adaptive.
; With Frame Generation on, frames are shown by the mod instead of the game, so the DXVK HUD, Steam overlay and
; OBS "game capture" do not see them (use window / display capture in OBS). If Frame Generation fails, the game
; falls back to its normal image (never a black screen) and the menu explains why.
; In-game V-Sync: keep it off and use the mod's FPS cap (TargetFps) with G-SYNC / FreeSync. With V-Sync on, or in
; exclusive fullscreen at a resolution other than the desktop, Frame Generation can only start with a game restart.
; Input latency with Frame Generation is roughly twice that of the same FPS cap without it.
Mode=0
; ADVANCED. 1 (default) = Frame Generation can be turned on and off while playing. 0 = only at game start.
LiveSwitch=1
; ADVANCED. Who shows the frames: 1 (default) = the game process (G-SYNC / FreeSync works with Frame Generation),
; 0 = the helper (fixed refresh rate, slight stutter).
GamePresent=1
; ADVANCED. 1 (default) = frames are handed over early with their display time (more even pacing).
GamePresentEarly=1
; Multiplier: displayed frames per real frame. 2 (default); DLSS-G 3x - 6x only on RTX 50; FSR 3x - 6x on all cards.
; A higher multiplier means fewer real frames at the same cap (more latency, more generated artifacts).
; auto = chosen by GPU headroom (needs LimiterAdapt=3); changes while playing. Also in the menu.
Multiplier=2
; Limits for Multiplier=auto (2 .. 6; never above what the GPU supports).
AutoMinMultiplier=2
AutoMaxMultiplier=6
; Multiplier at start with auto (default = AutoMinMultiplier).
AutoStartMultiplier=2
; ADVANCED. Auto raises the multiplier only when the real-frame cap would have to drop below this percentage
; (50 .. 99, default 75).
AutoUpBelow=75
; ADVANCED. Seconds to hold before raising / lowering the multiplier.
AutoUpHold=3.0
AutoDownHold=1.0
; DEBUG. Experimental UI mask for DLSS-G. 0 = off (default).
DlssgUiAlpha=0
; ADVANCED. Sharpening of generated frames (0 .. 1; 0 = off, not recommended).
SharpenGen=0
; FPS cap of DISPLAYED frames (target for FSR adaptive / DLSS-G adaptive). The game renders cap / multiplier real frames.
; 0 = automatic from the monitor refresh rate like NVIDIA Reflex (recommended): Hz - Hz*Hz/3600 (165 Hz -> 157,
; 144 -> 138, 240 -> 224), below the G-SYNC / FreeSync limit. A number (20 .. 9999) is used exactly, in all modes, even
; above the refresh rate: the monitor then shows more frames only in part and the image may tear (G-SYNC / FreeSync does
; not work above its range). Generation goes up to 6 displayed frames per real frame: a target above 6 x the real FPS
; gives 6 x the real FPS. Keep a driver / RTSS FPS limit at the same or a higher value.
TargetFps=0
; FSR adaptive / DLSS-G adaptive: cap of REAL game frames (0 = off; e.g. 60 / 80 / 100 / 120 - the rest up to the target is generated).
RealCap=0
; FSR adaptive / DLSS-G adaptive: when to generate frames. Frame generation adds some input latency, so it pays off
; mainly while the game itself runs slow. The mod measures the game FPS without
; generation while playing and compares it with the output target (TargetFps, or the automatic display cap):
;   responsiveness = generate below 50 % of the target, stop above 60 %, only if the displayed FPS rise by 40 %+
;   balanced (default) = below 75 %, stop above 85 %, at least +25 %
;   smooth = below 85 %, stop above 95 %, at least +15 %
;   always = fill up to the target whenever the game is below it (behavior up to this version; FillBelow applies)
;   custom = below PreferencePct; a number 20 .. 95 here is the same as custom with that percentage
;   steady = EXPERIMENTAL, untested: keep the output steady for monitors with backlight strobing (below 105 FPS
;            generate, stop above 125; DLSS-G adaptive with AdaptLock and an output target of 100+ only)
; Generation also stops when the gain is too small or the game would meet the target by itself. Switching keeps the
; generator running (no flicker). A scene that keeps swinging around the thresholds keeps generating longer.
; If the game FPS cannot be measured (GameThreads=0, no GPU counters), the mod behaves as "always".
; The thresholds assume G-SYNC / FreeSync. On a fixed refresh rate (no VRR) choose "always" (fewer uneven frames).
Preference=balanced
; Threshold for Preference=custom in percent of the output target (20 .. 95, default 75).
PreferencePct=75
; ADVANCED. Preference=custom: stop generating this many percentage points above PreferencePct (3 .. 40, default 10;
; at most 97 % of the target).
PreferenceHyst=10
; ADVANCED. Minimum gain of displayed FPS in percent (0 .. 100). Empty = by Preference (40 / 25 / 15 %, custom 25 %).
PreferenceMinGain=
; FSR adaptive / DLSS-G adaptive with Preference=always: generate only below this real FPS (0 = auto, 90 % of the target).
FillBelow=0
; ADVANCED. FSR adaptive / DLSS-G adaptive: safety margin of the delay between game frames and displayed frames in ms
; (0 .. 5, default 1.0). Lower = less input latency, but more late frames when the frame rate fluctuates.
AdaptMarginMs=1.0
; FSR adaptive / DLSS-G adaptive: fraction lock. 1 = while frames are being generated, the real frame rate of the
; game is held at the nearest lower fraction q/p of the target (5/6, 4/5, 3/4, 2/3, 3/5, 1/2, 2/5, 1/3, 1/4, 1/5;
; also below RealCap). Every p-th displayed frame is then a real one, the generated frames sit at fixed positions
; between real frames and the delay is shorter. Costs real FPS: usually a few percent, up to about 15 % when RealCap
; lies between two fractions. 0 = off: real frames run free up to the target.
; auto (default) = on for DLSS-G adaptive (DLSS-G can only place frames at k/n positions - with the lock their timing
; is exact, and the delay is clearly shorter when the GPU is the limit), off for FSR adaptive.
AdaptLock=auto
; ADVANCED. Largest denominator p of the lock fractions (2 .. 8, default 6; DLSS-G adaptive uses at most 6).
AdaptLockDen=6
; ADVANCED. DLSS-G adaptive: 1 (default) = only the needed DLSS-G frames of each frame pair are computed (cheaper;
; relies on behavior verified with DLSS-G 310.9.x and checked while playing, see DlssgWatch). 0 = always the full
; sequence as documented by NVIDIA, unused frames are discarded (about twice the GPU time).
DlssgSelect=1
; ADVANCED. DLSS-G adaptive: 1 (default) = generated frames are checked while playing (tiny thumbnails); if they
; turn out wrong (for example after a DLSS-G library update), the mod switches to DlssgSelect=0 until the game is
; restarted and writes it to bms_dlss_helper.log. 0 = no check.
DlssgWatch=1
; ADVANCED. DLSS-G adaptive: highest DLSS-G frame count per pair (2 .. 5, default 5 = positions k/n with n up to 6).
DlssgFareyMax=5
; 0 (default) = keep generating while the mod menu (Alt+N) is open. 1 = pause Frame Generation while the menu is open.
PauseInMenu=0
; ADVANCED. GPU headroom regulator for the real-frame cap: 3 (default) = by GPU time (fast, like Reflex),
; 2 = by missed slots, 1 = old experiment, 0 = off.
LimiterAdapt=3
; ADVANCED. Regulator 3 also for FSR adaptive (1 = on, default 0). Not used with AdaptLock=1.
LimiterAdaptFsr=0
; ADVANCED. After Alt+Tab (or a pause of the game) the game runs slower for a few seconds. For up to this many
; seconds (default 8) the real-frame cap and the AdaptLock step from before Alt+Tab are kept and nothing is lowered;
; it ends sooner once the game is back to its earlier FPS. 0 = off (cap restarts at 100 % and adapts again).
ResumeGuard=8
; ADVANCED. FSR adaptive / DLSS-G adaptive: lowest real FPS for AdaptLock (default 40; never above half the output
; target, so 2x is always allowed at 60 Hz). From a base this low each real frame is held long, so latency and
; artifacts of generated frames grow; when the game itself runs below it, the output target drops to AdaptLowMult x
; the real FPS (default 3, range 2 .. 6) instead of filling up to the full target with up to 5 generated frames per real.
; Back to the full target above 115 % of the limit for 2 s; a return the GPU cannot keep is tried again only at a
; higher real FPS. 0 = off.
AdaptMinFps=40
AdaptLowMult=3
; ADVANCED. Catch-up of generated frames: 2 (default) = only for frames finished on the GPU, 1 = by queue length,
; 0 = drop late frames.
Catchup=2
; ADVANCED. After turning Frame Generation on while playing, refresh the presentation window once after this many
; ms (against a frozen image). 0 = off.
LiveRefreshMs=800
; ADVANCED. Refresh method: 4 = brief layered window at switch-on (one flicker, default), 3 = layered + new swapchain
; after LiveRefreshMs, 0 = none. Used only with OffWindow=0.
LiveRefreshMode=4
; ADVANCED. 0 (default) = without Frame Generation the game is shown directly in the game window. 1 = through a child
; window of the mod (without Frame Generation then through the desktop compositor, see [present] DxvkFse).
OffWindow=0
; ADVANCED. 1 (default) = if the Frame Generation image goes through the desktop compositor although the game window
; is in front and covers the whole monitor (can happen when the game was started in the background), the presentation
; swapchain is created again (at most 3 times) so the driver flips it directly. 0 = off.
HealComposed=1
; ADVANCED. 1 (default) = also pass the image without HUD to the generator, so the HUD does not move with the scene
; in generated frames. 0 = off.
HudLess=1
; ADVANCED. Limiter margin in percent below the automatic target (TargetFps=0; default 1.0). A TargetFps number has none.
LimiterMargin=1.0
; DEBUG. MatrixTranspose: camera matrix convention for DLSS-G. DumpFrames=N: save N sets of frames as BMP next to the
; helper log after DumpAfter generated frames (large files).
MatrixTranspose=1
DumpFrames=0
DumpAfter=300
; Other debug keys are not listed here.

[present]
; DEBUG. Experimental presentation path for tests only. 0 = off (default).
HelperPresent=0
; DEBUG. Presentation target: 0 = child window (default), 1 = game window directly.
; Target=0
; DEBUG. Start time limit of Frame Generation in ms (default 30000). If Frame Generation does not start in time,
; it can be retried by turning it off and on in the menu.
; StartTimeoutMs=30000
; ADVANCED, Frame Generation off only. 1 (default) = direct full-screen flip (FPS above the refresh rate, lower latency).
; The mod releases the flip before Frame Generation starts and takes it back when it is turned off. 0 = the game image
; goes through the desktop compositor (FPS near the refresh rate, no tearing, slightly higher latency); use it if the game
; image stays on the screen after Alt+Tab. Default is 0 with [fg] OffWindow=1.
; DxvkFse=1
; Experimental, only with DxvkFse=1 and OffWindow=1: 1 = the mod releases the fullscreen flip when the game is minimized
; (the NVIDIA driver may crash on a quick return). 0 (default) = decided by the driver.
; AltTabRelease=0

[debug]
; Self-checks. 1 (default) = every ~5 s the mod compares its own counters with what must hold: every game frame is
; displayed, the image reaches the screen by a direct flip and not through the desktop compositor, the frame limiter
; stays under the display cap, adaptive Frame Generation does not generate needlessly or stay on a low lock step,
; mouse movement in the game turns the camera, and the game does not consider itself inactive while its window is in
; front. Every "vykon" line also shows the camera rotation and the raw mouse movement of the interval.
; A violation writes one line "KONTROLA: ..." to bms_dlss.log (each check at most once per 60 s). Nothing is shown
; on screen and the cost is negligible. 0 = off.
SelfCheck=1
; DEBUG. Breaks things on purpose to verify the self-checks (bit mask): 1 = the presenter keeps the display cap with
; a TargetFps above it, 2 = adaptive modes never turn needless generation off, 4 = the adaptive lock stays on its lowest step.
; SelfCheckTest=0
; Game thread timing. 1 (default) = the mod measures the CPU time of the game's
; main thread and of the thread that calls Present, how long the main thread waits for the render thread (hooks on
; the wait functions in the game modules' import tables, they only pass the call on), and lists the busiest threads
; of the process every ~5 s ("vlakna hry" line in bms_dlss.log). The "odhad FG" line uses it to estimate the FPS
; without frame generation also with the adaptive lock, and [fg] Preference needs it to decide when to generate.
; 0 = off (Preference then behaves as "always").
; GameThreads=1
; DEBUG. 0 = with [fg] Preference the game is never held below its GPU limit while showing real frames only (tests).
; Default 1: the cap is used only after the presenter was measured skipping frames.
; PrefCap=1
; DEBUG. 1 (default) = with [fg] Preference showing real frames only, the game waits until the previous frame was
; shown, so the presenter never skips frames (even motion). 0 = off (tests).
; PrefBackpressure=1
; DEBUG (test only). Base cap for "real frames only" with [fg] Preference, as a share of what the GPU can do
; (0.85 .. 1). Measured at 0.97: about 4 % fewer FPS, less even frame pacing and no lower latency. 1 (default) = no
; cap until the presenter was measured skipping frames.
; PrefCapK=1.0
; DEBUG (test). 1 = the latency regulator ([latency] Mode=1) counts the back-pressure wait as GPU wait, so the game
; sleeps before it reads the next input instead of a finished frame waiting before hand-off. Default 0.
; PrefBpReg=0
; DEBUG. 1 = frames around every switch of adaptive frame generation are written to bms_dlss_fgest.csv (for offline
; analysis). Default 0.
; FgEstCsv=0
; Input latency measurement (log only, no change in behaviour): a marker message in the game's message pump marks
; when the game takes the mouse input; then the start of drawing, Present and the time the frame is shown are
; measured. Line "latence vstupu" in bms_dlss.log every ~5 s (average and 95th percentile of each part). 0 = off.
; LatChain=1
; DEBUG. 1 = frame, pump and display records of the input latency measurement to bms_dlss_latchain.csv. Default 0.
; LatChainCsv=0

[menu]
; In-game settings menu (Alt+N). Drawn on top of the finished image (DLSS / FSR do not see it). The keyboard hook
; is limited to the game window while the game runs; while the menu is open the game receives no keys
; (except F4, Alt+F4, PrintScreen, Windows and media keys).
; After closing, the menu writes only the keys it changed to this file.
; 0 = no menu, no keyboard hook and no on-screen messages
Enable=1
; 1 = the hook also keeps the mod hotkeys (Alt+F8 ...) from the game; other Alt keys always reach the game.
; 0 = only the menu key and keys while the menu is open
SwallowKeys=1
; Text size: 0.5 .. 1.5
Scale=1.0
; Menu position: center, left, right, topleft, topright
Position=center
; Language: auto (by the game language: Czech -> Czech, otherwise English), cs, en
Language=auto
; On-screen messages: 1 = a short "item: value" line top left after a hotkey change (2 s), 0 = beep and log only
Osd=1
; 1 = show "bms-dlss settings: Alt+N" once for 6 s after start, 0 = off
StartHint=1
; FPS counter: 1 = small line top right "FPS 78 / 156" (real / displayed frames). Default 0. Also in the menu.
FpsCounter=0
; 1 = show the running upscaler and Frame Generation with version and multiplier in the corner. Default 0.
OverlayVersions=0
; Smoothness diagnostics (top right): "Game" = FPS rendered by the game, "Monitor" = frames per second really sent
; to the monitor (generated ones included; without frame generation the DXVK Present), "Skipped" = finished frames
; the monitor never got (last ~1 s), the frame generation state (generating N x / real frames only and why) and a
; small graph of the gaps between frames on the monitor (a flat line = smooth). Default 0. Also in the menu.
DiagOverlay=0
; 1 = hotkeys beep, 0 = silent
Beep=1
; DEBUG. 1 = no keyboard hook (keys are polled; the game receives them too)
NoHook=0
; DEBUG. Automated menu test: TestOpenSec=N opens the menu N seconds after start (0 = off).
TestOpenSec=0
