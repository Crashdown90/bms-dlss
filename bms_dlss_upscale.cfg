// bms-dlss: skutecny upscaling (cast B). Hra renderuje mensi obraz a DLSS ho dopocita na plne rozliseni
// (uspora energie, obraz o neco mekci nez DLAA). EXPERIMENTALNI: engine pri zmensenem renderu kresli do vyrezu,
// mod to opravuje zaplatami (LightsB) - vysledek se muze lisit podle mapy; vychozi je nativni.
// Nacita ho autoexec.cfg radkem "exec bms_dlss_upscale" (pridal
// install.ps1, odebere uninstall.ps1). Tento soubor install.ps1 pri aktualizaci prepisuje - vlastni zmeny patri
// do autoexec.cfg ZA radek exec.
//
// Klavesa F4: nativni (DLAA / supersampling) -> Quality (0.667) -> Balanced (0.58) -> nativni. Zprava v konzoli.
// Jinou klavesu nastavis v autoexec.cfg za radkem exec, napr.:  unbind F4  a  bind "KP_PLUS" "dlss_vp"
//
// Po startu hry je vzdy nativni rozliseni: hra si mat_viewportscale uklada do config.cfg a bez modu (spusteni
// bez volby Steamu "Hrat DXVK") by zmenseny render jen rozmazane roztahl engine. Kdo chce usporny rezim trvale,
// prida do autoexec.cfg za radek exec:  dlss_q
alias dlss_nat "mat_viewportscale 1; alias dlss_vp dlss_q; echo bms-dlss: nativni rozliseni (DLAA / supersampling)"
alias dlss_q "mat_viewportscale 0.667; mat_viewportupscale 1; alias dlss_vp dlss_b; echo bms-dlss: usporny rezim Quality (render 0.667, experimentalni)"
alias dlss_b "mat_viewportscale 0.58; mat_viewportupscale 1; alias dlss_vp dlss_nat; echo bms-dlss: usporny rezim Balanced (render 0.58, experimentalni)"
bind "F4" "dlss_vp"
dlss_nat
